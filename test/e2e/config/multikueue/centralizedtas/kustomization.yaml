apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Centralized TAS overlay. Deploys the default Kueue with the
# MultiKueueCentralizedTAS feature gate enabled.
resources:
- ../../default

configMapGenerator:
- behavior: merge
  files:
  - controller_manager_config.yaml
  name: kueue-manager-config
  namespace: kueue-system
